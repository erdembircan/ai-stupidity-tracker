name: Bump Homebrew Formula

on:
  push:
    tags: 'v*'

jobs:
  checks:
    if: ${{ !contains(github.ref, '-') }}
    uses: ./.github/workflows/templates/checks.yml

  homebrew:
    name: Bump Homebrew formula
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: ast
          formula-path: Formula/ast.rb
          homebrew-tap: erdembircan/homebrew-tap
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

  docs:
    name: Update docs
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out docs branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Update version and changelog in docs
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          source/.github/scripts/update-docs.sh "$VERSION" source/CHANGELOG.md pages/index.html

      - uses: EndBug/add-and-commit@v9
        with:
          cwd: pages
          message: "docs: update version to ${{ github.ref_name }}"
